name: Update profile art

# Refresh the stats card from GitHub's public contribution calendar.
# The portrait stays static; the card is committed only when its data changes.

"on":
  schedule:
    # Keep the 5-minute refresh, but stagger away from the busy top of each hour.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  # Share one serialized queue with the workflow that commits other profile assets.
  group: profile-generated-assets
  queue: max

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: abhinavrathee
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Allow GitHub to index the triggering push
        if: github.event_name == 'push'
        run: sleep 240

      - name: Scrape and validate GitHub's public contribution calendar
        run: python scripts/fetch_contributions.py

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Keep refresh commits out of the profile's contribution total.
          commit_message: "chore: refresh profile stats [skip ci]"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          file_pattern: "data/contributions.json stats.svg"
