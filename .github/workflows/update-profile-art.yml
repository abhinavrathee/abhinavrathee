name: Update profile art

# Refresh the stats card from GitHub's public contribution calendar.
# The portrait stays static; the card is committed only when its data changes.

"on":
  schedule:
    - cron: "*/5 * * * *"  # GitHub's shortest supported interval
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: profile-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: abhinavrathee
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Allow GitHub to index the triggering push
        if: github.event_name == 'push'
        run: sleep 240

      - name: Scrape and validate GitHub's public contribution calendar
        run: python scripts/fetch_contributions.py

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile stats [skip ci]"
          file_pattern: "data/contributions.json stats.svg"
